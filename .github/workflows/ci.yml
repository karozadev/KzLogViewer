name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # cmd/kzlogviewer is a thin composition root (CLI dispatch and
      # dependency wiring); coverage is enforced on internal/..., which
      # holds the domain, ports, services and adapters.
      - name: Test with coverage
        run: go test ./internal/... -race -covermode=atomic -coverprofile=coverage.out

      - name: Enforce 80% coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 80) { print "coverage " total "% is below the 80% threshold"; exit 1 } }'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
